name: Deployed SHA Drift

# Asks the box what it is running and compares it to main, rather than trusting
# that a green deploy means the deploy landed. On 2026-09-14 seven deploys raced
# for the same commit, one won, and production sat two commits behind main with
# nothing red left on the board to say so. The per-deploy image assertion cannot
# catch that: every run correctly verified its own sha, and the newest one simply
# lost. This is the independent oracle for the same question.
on:
  schedule:
    # Every six hours. Drift that matters persists; drift that resolves itself
    # inside six hours was a deploy still in flight.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  drift:
    name: Compare production against main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Only compare once main's newest commit has actually finished deploying.
      # The first version of this gate only skipped while a deploy was running,
      # which reported drift in the window between the merge and the deploy
      # starting: CI still had to pass first. Asking for a completed deploy run
      # for this exact sha covers all three states at once, no deploy created
      # yet, one in flight, or one finished.
      #
      # A deploy that finished and failed is not skipped. Production really is
      # behind in that case, which is the thing worth saying out loud.
      #
      # Skipping is also why this does not share the deploy's concurrency group:
      # queueing behind a deploy would let a drift check displace a pending one.
      - name: Wait for this commit to have finished deploying
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh run list --workflow=deploy-aws.yml --limit 20 \
            --json headSha,status \
            -q "[.[] | select(.headSha == \"$GITHUB_SHA\")] | first | .status // \"none\"")
          if [ "$status" != "completed" ]; then
            echo "no completed deploy for ${GITHUB_SHA:0:7} yet (status: $status), nothing to compare"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy for ${GITHUB_SHA:0:7} has finished, comparing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the running sha off the instance
        if: steps.gate.outputs.skip != 'true'
        id: running
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          cid=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["grep -o sha-[0-9a-f]* /opt/tellsight/docker-compose.override.yml | sort -u | head -1"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$cid" --instance-id "$EC2_INSTANCE_ID" || true
          out=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text | tr -d '[:space:]')
          echo "sha=${out#sha-}" >> "$GITHUB_OUTPUT"
          echo "production is pinned to ${out:-<nothing>}"

      - name: Fail if production is not on main
        if: steps.gate.outputs.skip != 'true'
        env:
          RUNNING: ${{ steps.running.outputs.sha }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:7}"
          if [ -z "$RUNNING" ]; then
            echo "Could not read a pinned sha off the instance." >&2
            exit 1
          fi
          if [ "$RUNNING" = "$expected" ]; then
            echo "production is on $expected, matching main"
            exit 0
          fi
          echo "DRIFT: production is on sha-$RUNNING, main is $expected" >&2
          echo "The last deploy that actually landed was not for the newest commit." >&2
          echo "Check for a red deploy run, or a green one that lost a race." >&2
          exit 1
