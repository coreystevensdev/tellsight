name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint

      - run: pnpm type-check

      # Rollback re-pins the image but never the database, so a migration that
      # drops something the previous release reads turns a rollback into a
      # second outage.
      - name: Migration rollback compatibility
        run: pnpm -C apps/api exec tsx ../../scripts/check-migration-compat.ts

  # Deliberately not gated on `quality`: a leaked credential is worth knowing
  # about even when the build is broken for unrelated reasons.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-shared-web:
    name: Tests (shared + web)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Coverage thresholds live in each package's vitest.config.ts and are set
      # as a ratchet just under measured coverage, so this fails on a real drop
      # rather than on noise.
      - name: Run shared + web tests
        run: |
          pnpm -C packages/shared exec vitest run --coverage \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/shared.json"
          pnpm -C apps/web exec vitest run --coverage \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web.json"
        env:
          CI: "true"

      - name: Record executed test count
        run: |
          node scripts/count-from-reports.mjs \
            "$RUNNER_TEMP/shared.json" "$RUNNER_TEMP/web.json" > count-shared-web

      - uses: actions/upload-artifact@v4
        with:
          name: test-count-shared-web
          path: count-shared-web
          retention-days: 1

  # This job was continue-on-error for a long time, on the theory that the
  # Vitest + Drizzle + Anthropic SDK module graph exceeded runner memory. Whatever
  # was true when that was written is not true now: the step has succeeded on
  # every run checked, and a genuine OOM does not pass repeatedly. The flag meant
  # 2,265 of the suite's 3,134 tests could not fail the build, which is worse than
  # any flake it was hiding.
  test-api:
    name: Tests (API)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -C packages/shared build

      - name: Run API tests
        working-directory: apps/api
        run: |
          npx vitest run \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/api.json"
        env:
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/api.json" > count-api

      - uses: actions/upload-artifact@v4
        with:
          name: test-count-api
          path: count-api
          retention-days: 1

  test-api-rls-integration:
    name: Tests (API RLS integration)
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_admin -d analytics"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No shared-package build step: vitest.integration.config.ts aliases
      # shared/* straight to packages/shared/src, same as proposal-precision-eval
      # and seed-validation, which skip the build for the same reason.

      # app_user only gets privileges on tables created after this runs
      # (ALTER DEFAULT PRIVILEGES), so it has to happen before migrations,
      # matching the order the production Docker image boots in.
      - name: Create app_user role
        run: PGPASSWORD=app psql -h localhost -U app_admin -d analytics -f docker/init.sql

      - name: Run migrations
        run: pnpm --filter api db:migrate:run
        env:
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics

      - name: Run RLS integration tests
        run: |
          pnpm -C apps/api exec vitest run -c vitest.integration.config.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/integration.json"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://app_user:app@localhost:5432/analytics
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics
          REDIS_URL: redis://localhost:6379
          CLAUDE_API_KEY: dummy-claude-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID: price_dummy
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          JWT_SECRET: dummy-jwt-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          EMAIL_FROM_ADDRESS: noreply@example.com
          EMAIL_MAILING_ADDRESS: 123 CI Test Way

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/integration.json" > count-integration

      - uses: actions/upload-artifact@v4
        with:
          name: test-count-integration
          path: count-integration
          retention-days: 1

  seed-validation:
    name: Seed Data Validation
    needs: [test-shared-web]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C apps/api exec tsx ../../scripts/validate-seed.ts
        env:
          DATABASE_URL: postgresql://app_user:app@localhost:5432/analytics
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics
          REDIS_URL: redis://localhost:6379
          CLAUDE_API_KEY: dummy-claude-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID: price_dummy
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          JWT_SECRET: dummy-jwt-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          NODE_ENV: test
          EMAIL_FROM_ADDRESS: noreply@example.com
          EMAIL_MAILING_ADDRESS: 123 CI Test Way

  proposal-precision-eval:
    name: Proposal Precision Eval
    needs: [test-shared-web]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C apps/api exec tsx ../../scripts/eval-proposal-precision.ts

  test-eval:
    name: Eval Script Tests
    needs: [test-shared-web]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run eval script tests
        run: |
          pnpm -C apps/api exec vitest run -c ../../scripts/vitest.config.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/eval.json"

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/eval.json" > count-eval

      - uses: actions/upload-artifact@v4
        with:
          name: test-count-eval
          path: count-eval
          retention-days: 1

  e2e:
    name: E2E Tests
    needs: seed-validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Copy CI env file
        run: cp .env.ci .env

      - name: Start Docker Compose (production build)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for API health..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health || (echo "API failed to start" && docker compose -f docker-compose.yml -f docker-compose.ci.yml logs && exit 1)

          echo "Waiting for web app..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web app ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000 || (echo "Web app failed to start" && docker compose -f docker-compose.yml -f docker-compose.ci.yml logs && exit 1)

      - name: Run Playwright tests
        run: npx playwright test

      - name: Record executed test count
        run: |
          node scripts/count-from-reports.mjs --playwright e2e-results.json > count-e2e

      - uses: actions/upload-artifact@v4
        with:
          name: test-count-e2e
          path: count-e2e
          retention-days: 1

      # A retried pass is a green tick, so a test that only passes on the second
      # attempt is invisible until it fails twice in a row. Annotates rather than
      # fails: the retry is deliberate, and turning every retry into a red build
      # is how a useful retry gets deleted.
      - name: Surface retried tests
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("e2e-results.json")) process.exit(0);
            const report = JSON.parse(fs.readFileSync("e2e-results.json", "utf8"));
            const retried = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  if ((test.results ?? []).some((r) => r.retry > 0 && r.status === "passed")) {
                    retried.push(spec.title);
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            for (const title of retried) {
              console.log(`::warning title=Flaky e2e test::${title} passed only on retry`);
            }
            console.log(retried.length ? `${retried.length} test(s) passed only on retry` : "no retried passes");
          '

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes

  docker-smoke:
    name: Docker Smoke Test
    needs: e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Copy CI env file
        run: cp .env.ci .env

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      # --load runs k6/load-test.js against the stack the smoke test just
      # proved healthy, so the SLO thresholds in that script gate the build
      # instead of only being checked by hand.
      - name: Run smoke test and load test
        run: bash scripts/smoke-test.sh --ci --load

  test-count:
    name: Test Count
    # Every suite that contributes to the badge, because the numbers now come
    # from those runs rather than from a separate collection here.
    needs: [test-shared-web, test-api, test-api-rls-integration, test-eval, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          pattern: test-count-*
          merge-multiple: true

      - name: README test count matches what every suite ran
        run: |
          # Each suite writes the count its own run reported, so this asserts
          # executed tests. It used to call `vitest list`, which stopped being a
          # usable count under vitest 5: an it.each lists once as its unexpanded
          # "%s" template instead of once per case, so the collected total read
          # 4,015 while 4,502 tests still ran.
          for f in count-shared-web count-api count-integration count-eval count-e2e; do
            [ -s "$f" ] || { echo "$f is missing or empty, so a suite did not report"; exit 1; }
          done
          read -r shared_web < count-shared-web
          read -r api < count-api
          read -r integration < count-integration
          read -r eval < count-eval
          read -r e2e < count-e2e
          vitest=$((shared_web + api + integration + eval))
          total=$((vitest + e2e))
          fmt() { python3 -c "import sys; print(f'{int(sys.argv[1]):,}')" "$1"; }
          v=$(fmt "$vitest"); t=$(fmt "$total")
          echo "shared+web $shared_web / api $api / integration $integration / eval $eval / e2e $e2e"
          echo "vitest $v, total $t"
          fail=0
          grep -q "badge/tests-${t/,/%2C}-brightgreen" README.md || { echo "badge does not say $t"; fail=1; }
          grep -q "alt=\"$t tests\"" README.md || { echo "badge alt text does not say $t"; fail=1; }
          grep -q "$t automated tests ($v Vitest plus $e2e Playwright E2E)" README.md || { echo "overview line does not say $t ($v Vitest plus $e2e Playwright)"; fail=1; }
          [ "$fail" = 0 ] || { echo "Run scripts/count-tests.sh and update README.md."; exit 1; }
          echo "README agrees with every suite: $t"

  # Deployment itself lives in deploy-aws.yml, triggered via workflow_run once
  # this workflow succeeds on main. No deploy job here, ECR build/push + SSM
  # deploy + health poll all happen there.
