name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads repository contents and exchanges artifacts between its own
# jobs. Keep the automatic token read-only even if the repository default is
# broadened later.
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      - run: pnpm turbo lint

      - run: pnpm type-check

      # Rollback re-pins the image but never the database, so a migration that
      # drops something the previous release reads turns a rollback into a
      # second outage.
      - name: Migration rollback compatibility
        run: pnpm -C apps/api exec tsx ../../scripts/check-migration-compat.ts

      # High and critical advisories in production dependencies. The script
      # carries the acknowledgement list rather than this step carrying an
      # --audit-level threshold, because a bare threshold goes red on dev-only
      # noise and then gets muted. See the comment at the top of it.
      - name: Dependency audit
        run: pnpm -C apps/api exec tsx ../../scripts/check-dependency-audit.ts

      # A token in a path reaches CloudWatch unless the Caddy matcher excludes
      # it, and that matcher is a hand written list that was wrong the day it
      # was written.
      - name: Access log redaction covers token routes
        run: pnpm -C apps/api exec tsx ../../scripts/check-log-redaction.ts

      - name: Deployment script syntax
        run: |
          python3 -m py_compile scripts/deploy-via-ssm.py
          bash -n scripts/check-production-health.sh
          bash -n scripts/verify-production-https.sh

  # Deliberately not gated on `quality`: a leaked credential is worth knowing
  # about even when the build is broken for unrelated reasons.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting would require handing a third-party action a write token;
          # the failing check and job summary already surface every finding.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test-shared-web:
    name: Tests (shared + web)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      # Coverage thresholds live in each package's vitest.config.ts and are set
      # as a ratchet just under measured coverage, so this fails on a real drop
      # rather than on noise.
      - name: Run shared + web tests
        run: |
          pnpm -C packages/shared exec vitest run --coverage \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/shared.json"
          pnpm -C apps/web exec vitest run --coverage \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web.json"
        env:
          CI: 'true'

      - name: Record executed test count
        run: |
          node scripts/count-from-reports.mjs \
            "$RUNNER_TEMP/shared.json" "$RUNNER_TEMP/web.json" > count-shared-web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-count-shared-web
          path: count-shared-web
          if-no-files-found: error
          retention-days: 1

  # This job was continue-on-error for a long time, on the theory that the
  # Vitest + Drizzle + Anthropic SDK module graph exceeded runner memory. Whatever
  # was true when that was written is not true now: the step has succeeded on
  # every run checked, and a genuine OOM does not pass repeatedly. The flag meant
  # 2,265 of the suite's 3,134 tests could not fail the build, which is worse than
  # any flake it was hiding.
  test-api:
    name: Tests (API)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      # The chart renderer runs in a worker thread, and a worker's module graph
      # is resolved by plain Node rather than vitest. It loads the compiled
      # worker from dist in every environment, so the tests only exercise what
      # ships if dist is current. Building here is what makes that true.
      - name: Build API
        run: pnpm --filter api build

      - name: Run API tests
        working-directory: apps/api
        run: |
          npx vitest run --coverage \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/api.json"
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/api.json" > count-api

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-count-api
          path: count-api
          if-no-files-found: error
          retention-days: 1

  test-api-rls-integration:
    name: Tests (API RLS integration)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_admin -d analytics"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      # oauthState.integration.test.ts is the only suite here that needs redis,
      # and it needs a real one: it proves takeOAuthState is single use under a
      # concurrent race, which an in-memory fake cannot express. REDIS_URL was
      # already set on the test step; nothing was listening on it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      # app_user only gets privileges on tables created after this runs
      # (ALTER DEFAULT PRIVILEGES), so it has to happen before migrations,
      # matching the order the production Docker image boots in.
      - name: Create app_user role
        run: PGPASSWORD=app psql -h localhost -U app_admin -d analytics -f docker/init.sql

      - name: Run migrations
        run: pnpm --filter api db:migrate:run
        env:
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics

      - name: Run RLS integration tests
        run: |
          pnpm -C apps/api exec vitest run -c vitest.integration.config.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/integration.json"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://app_user:app@localhost:5432/analytics
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics
          REDIS_URL: redis://localhost:6379
          CLAUDE_API_KEY: dummy-claude-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID: price_dummy
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          JWT_SECRET: dummy-jwt-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          EMAIL_FROM_ADDRESS: noreply@example.com
          EMAIL_MAILING_ADDRESS: 123 CI Test Way

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/integration.json" > count-integration

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-count-integration
          path: count-integration
          if-no-files-found: error
          retention-days: 1

  seed-validation:
    name: Seed Data Validation
    needs: [test-shared-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      - run: pnpm -C apps/api exec tsx ../../scripts/validate-seed.ts
        env:
          DATABASE_URL: postgresql://app_user:app@localhost:5432/analytics
          DATABASE_ADMIN_URL: postgresql://app_admin:app@localhost:5432/analytics
          REDIS_URL: redis://localhost:6379
          CLAUDE_API_KEY: dummy-claude-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_ID: price_dummy
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          JWT_SECRET: dummy-jwt-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          NODE_ENV: test
          EMAIL_FROM_ADDRESS: noreply@example.com
          EMAIL_MAILING_ADDRESS: 123 CI Test Way

  proposal-precision-eval:
    name: Proposal Precision Eval
    needs: [test-shared-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      - run: pnpm -C apps/api exec tsx ../../scripts/eval-proposal-precision.ts

  test-eval:
    name: Eval Script Tests
    needs: [test-shared-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      - name: Run eval script tests
        run: |
          pnpm -C apps/api exec vitest run -c ../../scripts/vitest.config.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/eval.json"

      - name: Record executed test count
        run: node scripts/count-from-reports.mjs "$RUNNER_TEMP/eval.json" > count-eval

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-count-eval
          path: count-eval
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E Tests
    needs: seed-validation
    runs-on: ubuntu-24.04
    # Sized to the step budgets below rather than to a healthy run, which takes
    # about five minutes. apt and the browser download can claim 20 and 12 on a
    # bad mirror, and the unbudgeted compose and test steps need about eight, so
    # 25 was already under-committed by seven and would have killed a slow run
    # that was going to pass.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-workspace

      # A stalled mirror connection, not a slow one, is what fails this job: the
      # step takes 31s when it works and otherwise hangs to the timeout with a
      # download part-finished. Retrying the step is still wrong, because an
      # interrupted apt transaction leaves dpkg half-configured, so the retry
      # goes where it cannot do that: apt's own acquire layer, which gives up on
      # a stalled socket and refetches without ever interrupting the install.
      - name: Make apt give up on a stalled mirror rather than hang
        run: |
          sudo tee /etc/apt/apt.conf.d/99-stalled-mirror >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT::Keep-Downloaded-Packages "true";
          EOF

      # Caches the .deb files so a healthy mirror is needed when the dependency
      # list actually changes rather than once per run, or once per Playwright
      # version. On a hit apt installs from local files and never contacts the
      # mirror, which is the only thing that has actually broken this job.
      #
      # Keyed on the Playwright version, not the lockfile: the dependency list
      # only moves when Playwright does, and a lockfile key would miss on nearly
      # every run and cache nothing useful.
      - name: Resolve Playwright version for the cache key
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # restore-keys is what makes the bump itself survivable, and it is not
      # decoration. A cache keyed on the thing being upgraded cannot protect the
      # commit that upgrades it: the only run that can write main's entry for a new
      # Playwright version is the post-merge run, which is the run that needs it.
      # GitHub shares a default-branch cache down to every branch and never up from
      # a PR ref, so on 2026-11-24 both dependabot PRs cached 1.65.1 against their
      # own refs, main still owned only 1.65.0, and main took the cold path twice
      # and went red twice on a slow mirror while the deploy skipped.
      #
      # The exact key stays, so each version still gets its own entry. The prefix
      # fallback means a bump seeds from the previous version's .debs and apt fetches
      # only the delta, which for a patch bump is usually nothing at all.
      - name: Restore apt archives for Playwright deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            apt-playwright-${{ runner.os }}-${{ runner.arch }}-

      # Retries only matter on a cache miss, which is once per Playwright
      # version. A hit installs from the seeded .debs and never touches a mirror.
      #
      # The hazard that made the first attempt at this worse than nothing: timeout
      # kills install-deps and not the apt-get it spawned, and that orphan keeps
      # /var/lib/dpkg/lock-frontend. dpkg --configure -a cannot take a lock a live
      # process holds, so the guard alone does nothing and every later attempt
      # dies on the lock rather than running. Measured on #374, where all three
      # went that way after the first was killed. The orphan has to go first.
      #
      # Only between attempts, never before the first: on a fresh runner the only
      # thing that could hold that lock is the system's own unattended-upgrades,
      # and killing a transaction we did not start is the thing the original
      # comment here rightly warned about.
      - name: Install Playwright system dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail

          sudo mkdir -p /var/cache/apt/archives
          if compgen -G "$HOME/.cache/apt-playwright/*.deb" > /dev/null; then
            echo "Seeding apt from $(ls "$HOME"/.cache/apt-playwright/*.deb | wc -l) cached packages"
            sudo cp -n "$HOME"/.cache/apt-playwright/*.deb /var/cache/apt/archives/
          fi

          clear_apt_orphan() {
            sudo pkill -TERM -x apt-get 2>/dev/null || true
            sudo pkill -TERM -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x dpkg >/dev/null; then
                sudo dpkg --configure -a || true
                return 0
              fi
              sleep 2
            done
            echo "::warning title=apt lock::Orphan ignored TERM, escalating to KILL"
            sudo pkill -KILL -x apt-get 2>/dev/null || true
            sudo pkill -KILL -x dpkg 2>/dev/null || true
            sleep 2
            sudo dpkg --configure -a || true
          }

          save_cache() {
            mkdir -p "$HOME/.cache/apt-playwright"
            sudo cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt-playwright/" 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-playwright"
            echo "Cache now holds $(ls "$HOME"/.cache/apt-playwright/*.deb 2>/dev/null | wc -l) packages"
          }

          # 5m not 6m so three attempts plus two lock waits stay inside the
          # step deadline; a healthy install is about 40s either way.
          for attempt in 1 2 3; do
            echo "Playwright system dependency attempt ${attempt}/3"
            if timeout --signal=TERM --kill-after=30s 5m \
              npx playwright install-deps chromium webkit; then
              save_cache
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=apt retry::Attempt ${attempt} timed out or failed; clearing the dpkg lock and retrying"
              clear_apt_orphan
              sleep 10
            fi
          done

          echo "::error title=Playwright system dependencies failed::Three bounded attempts failed"
          exit 1

      # Version key, same as the apt cache above and for the reason already given
      # there: the browsers move only when Playwright does, so keying on the lockfile
      # minted a fresh ~387MB entry for every unrelated dependency bump. That left 9
      # distinct keys holding 5.66GB for the 2 Playwright versions CI has ever run.
      #
      # restore-keys is safe here specifically because "Install Playwright browsers"
      # below has no `if:` and runs on a cache hit too. A prefix restore is a head
      # start that install completes, never a wrong-version tree it would trust.
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      # Browser downloads are idempotent and safe to retry. Each attempt has
      # its own deadline, while the step deadline guards the retry plumbing.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Playwright browser install attempt ${attempt}/2"
            if timeout --signal=TERM --kill-after=30s 5m \
              npx playwright install chromium webkit; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "::warning title=Playwright download retry::Browser installation timed out or failed; retrying in 15 seconds"
              sleep 15
            fi
          done

          echo "::error title=Playwright browser installation failed::Both bounded download attempts failed"
          exit 1

      - name: Copy CI env file
        run: cp .env.ci .env

      - name: Start Docker Compose (production build)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for API health..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health || (echo "API failed to start" && docker compose -f docker-compose.yml -f docker-compose.ci.yml logs && exit 1)

          echo "Waiting for web app..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web app ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000 || (echo "Web app failed to start" && docker compose -f docker-compose.yml -f docker-compose.ci.yml logs && exit 1)

      - name: Run Playwright tests
        run: npx playwright test

      - name: Record executed test count
        run: |
          node scripts/count-from-reports.mjs --playwright e2e-results.json > count-e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-count-e2e
          path: count-e2e
          if-no-files-found: error
          retention-days: 1

      # A retried pass is a green tick, so a test that only passes on the second
      # attempt is invisible until it fails twice in a row. Annotates rather than
      # fails: the retry is deliberate, and turning every retry into a red build
      # is how a useful retry gets deleted.
      - name: Surface retried tests
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("e2e-results.json")) process.exit(0);
            const report = JSON.parse(fs.readFileSync("e2e-results.json", "utf8"));
            const retried = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  if ((test.results ?? []).some((r) => r.retry > 0 && r.status === "passed")) {
                    retried.push(spec.title);
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            for (const title of retried) {
              console.log(`::warning title=Flaky e2e test::${title} passed only on retry`);
            }
            console.log(retried.length ? `${retried.length} test(s) passed only on retry` : "no retried passes");
          '

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes

  docker-smoke:
    name: Docker Smoke Test
    # DW-238: a sibling of e2e, not its dependent. This read `needs: e2e`, and
    # nothing in the job wanted it: smoke-test.sh brings up its own stack
    # (scripts/smoke-test.sh:42 does `docker compose up -d --build`), jobs share
    # no state across runners, and there is no concurrency group rationing them.
    # What the dependency did buy was a withdrawal. e2e's `npx playwright
    # install-deps` carries a deliberate 10-minute bound, that bound was hit on
    # two of four runs on 2026-11-05 and 06, and each time this job reported
    # `skipped` rather than running, so a Docker regression would have gone
    # unnoticed because an apt mirror was slow.
    #
    # test-count still needs e2e and should: the badge it asserts sums the
    # playwright count, so it genuinely cannot total without that job.
    needs: seed-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copy CI env file
        run: cp .env.ci .env

      - name: Install pinned k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: '2.3.0'

      # --load runs k6/load-test.js against the stack the smoke test just
      # proved healthy, so the SLO thresholds in that script gate the build
      # instead of only being checked by hand.
      - name: Run smoke test and load test
        run: bash scripts/smoke-test.sh --ci --load

  test-count:
    name: Test Count
    # Every suite that contributes to the badge, because the numbers now come
    # from those runs rather than from a separate collection here.
    needs: [test-shared-web, test-api, test-api-rls-integration, test-eval, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-count-*
          merge-multiple: true

      - name: README test count matches what every suite ran
        run: |
          # Each suite writes the count its own run reported, so this asserts
          # executed tests. It used to call `vitest list`, which stopped being a
          # usable count under vitest 5: an it.each lists once as its unexpanded
          # "%s" template instead of once per case, so the collected total read
          # 4,015 while 4,502 tests still ran.
          for f in count-shared-web count-api count-integration count-eval count-e2e; do
            [ -s "$f" ] || { echo "$f is missing or empty, so a suite did not report"; exit 1; }
          done
          read -r shared_web < count-shared-web
          read -r api < count-api
          read -r integration < count-integration
          read -r eval < count-eval
          read -r e2e < count-e2e
          vitest=$((shared_web + api + integration + eval))
          total=$((vitest + e2e))
          fmt() { python3 -c "import sys; print(f'{int(sys.argv[1]):,}')" "$1"; }
          v=$(fmt "$vitest"); t=$(fmt "$total")
          echo "shared+web $shared_web / api $api / integration $integration / eval $eval / e2e $e2e"
          echo "vitest $v, total $t"
          fail=0
          grep -q "badge/tests-${t/,/%2C}-brightgreen" README.md || { echo "badge does not say $t"; fail=1; }
          grep -q "alt=\"$t tests\"" README.md || { echo "badge alt text does not say $t"; fail=1; }
          # The overview sentence used to repeat this total and now defers to the
          # badge. Two branches adding tests write the same wrong value from the
          # same base and git reports no conflict, so nothing at the git level
          # can catch it. This job is the thing that does.
          echo "vitest $v / e2e $e2e, asserted against the badge only"

          [ "$fail" = 0 ] || { echo "Run: bash scripts/count-tests.sh --write   (needs a database for the integration suite, see the script header)"; exit 1; }
          echo "README agrees with every suite: $t"

  # Deployment itself lives in deploy-aws.yml, triggered via workflow_run once
  # this workflow succeeds on main. No deploy job here, ECR build/push + SSM
  # deploy + health poll all happen there.
