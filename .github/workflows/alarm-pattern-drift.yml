name: Alarm Pattern Drift

# A CloudWatch metric filter waits for one exact log message, so renaming that
# message blinds the alarm without turning anything red. Application code ships
# through deploy-aws on every merge; the filter waits on a manual terraform
# apply. On 2026-10-27 be4e7eb changed both halves together, the code half
# shipped, and the digest alarm spent nine days matching a string nothing logged
# any more. It read OK the whole time, and would have read OK through an outage.
#
# deployed-sha-drift.yml asks the box what it is running. This asks CloudWatch
# what it is watching for. Same question, different half of the deploy.
#
# Deliberately not `terraform plan`, which would catch every kind of drift: plan
# needs the state file, state holds the RDS password, so CI would gain standing
# read access to the production database credential to check alarm config.
on:
  schedule:
    # Daily rather than six-hourly. Alarm config changes on a human timescale,
    # and the failure it catches persists until someone applies terraform.
    - cron: '41 7 * * *'
  workflow_dispatch:
  # Also on any change to the two halves that have to agree, so a PR that
  # renames a log message fails before it can merge and start the clock.
  pull_request:
    paths:
      - 'infra/terraform/monitoring.tf'
      - 'apps/api/src/**'
      - 'scripts/check-alarm-patterns.mjs'
      - '.github/workflows/alarm-pattern-drift.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  patterns:
    name: Deployed filters match messages the code logs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No --query: the script wants the whole shape so it can report a filter
      # that has no $.msg literal rather than silently skipping it.
      - name: Compare deployed filter patterns against the source
        run: |
          set -euo pipefail
          aws logs describe-metric-filters \
            --log-group-name /tellsight/containers \
            --output json > /tmp/filters.json
          node scripts/check-alarm-patterns.mjs < /tmp/filters.json
