name: Alarm Pattern Drift

# A CloudWatch metric filter waits for one exact log message, so renaming that
# message blinds the alarm without turning anything red. The two halves ship by
# different routes: application code goes out through deploy-aws on every merge,
# the filter waits on a manual terraform apply. On 2026-10-27 be4e7eb changed
# both halves together, the code half shipped, and the digest alarm spent nine
# days matching a string nothing logged any more. It read OK throughout.
#
# Two jobs because there are two questions, and only one of them needs AWS.
on:
  schedule:
    # Daily. Alarm config changes on a human timescale, and the failure this
    # catches persists until someone applies terraform.
    - cron: '41 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/terraform/monitoring.tf'
      - 'apps/api/src/**'
      - 'scripts/check-alarm-patterns.mjs'
      - '.github/workflows/alarm-pattern-drift.yml'

permissions:
  contents: read

# No setup-node and no setup-workspace. check-alarm-patterns.mjs imports only
# node:fs and node:path, so the runner's own node is enough and there is nothing
# to install. setup-node actively breaks here: package-manager-cache defaults on,
# it finds pnpm-lock.yaml, and then fails on "Unable to locate executable file:
# pnpm" because this job has no reason to install pnpm.
jobs:
  # Repo against itself: do the patterns in monitoring.tf match messages the
  # code logs? Runs on pull_request deliberately, and therefore holds no
  # credentials: no id-token, no role, no AWS. PR-authored code must never run
  # with the deploy role, which carries ssm:SendCommand on every instance and
  # so amounts to remote execution on production.
  #
  # This job would not have caught be4e7eb. That commit changed monitoring.tf
  # and the log message together, so the repo stayed self-consistent while the
  # deployed filter went stale. It catches the next rename before merge instead.
  repo-consistency:
    name: monitoring.tf patterns match the source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false


      - run: node scripts/check-alarm-patterns.mjs --from-terraform infra/terraform/monitoring.tf

  # Deployed against the repo: is CloudWatch watching for what the code logs?
  # This is the one that catches an un-applied terraform change, and the only
  # one that needs credentials, so it never runs from a pull request. Schedule
  # and manual dispatch both run main's own workflow file and main's own script.
  deployed:
    name: Deployed filters match messages the code logs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false


      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          # The read-only alarm-drift role, not the deploy role. Deliberate:
          # the deploy role carries ssm:SendCommand on every instance.
          role-to-assume: ${{ secrets.AWS_ALARM_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No --query: the script wants the whole shape so it can report a filter
      # with no $.msg literal rather than skipping it silently.
      - name: Compare deployed filter patterns against the source
        run: |
          set -euo pipefail
          aws logs describe-metric-filters \
            --log-group-name /tellsight/containers \
            --output json > /tmp/filters.json
          node scripts/check-alarm-patterns.mjs < /tmp/filters.json
