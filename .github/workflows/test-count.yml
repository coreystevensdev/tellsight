name: Test Count

# Collecting every suite costs about as long as the rest of CI put together, and
# the only thing that can invalidate the README's number is a test appearing or
# disappearing. So this runs when that could have happened, not on every push.
on:
  push:
    branches: [main]
    paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - 'e2e/**'
      - '**/vitest.config.ts'
      - '**/vitest.integration.config.ts'
      - 'scripts/vitest.config.ts'
      - 'scripts/count-tests.sh'
      - 'playwright.config.ts'
      - 'README.md'
      - '.github/workflows/test-count.yml'
  pull_request:
    paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - 'e2e/**'
      - '**/vitest.config.ts'
      - '**/vitest.integration.config.ts'
      - 'scripts/vitest.config.ts'
      - 'scripts/count-tests.sh'
      - 'playwright.config.ts'
      - 'README.md'
      - '.github/workflows/test-count.yml'

jobs:
  test-count:
    name: Test Count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: README test count matches every suite
        run: |
          # count-tests.sh uses `vitest list` and `playwright test --list`, which
          # collect without executing, so no database and no browsers are needed.
          out=$(bash scripts/count-tests.sh)
          echo "$out"
          val() { echo "$out" | awk -v k="$1" '$1==k{print $2}'; }
          t=$(val total_fmt); v=$(val vitest_fmt); e2e=$(val playwright)
          [ -n "$t" ] && [ -n "$v" ] && [ -n "$e2e" ] || { echo "count script produced no totals"; exit 1; }
          fail=0
          grep -q "badge/tests-${t/,/%2C}-brightgreen" README.md || { echo "badge does not say $t"; fail=1; }
          grep -q "alt=\"$t tests\"" README.md || { echo "badge alt text does not say $t"; fail=1; }
          grep -q "$t automated tests ($v Vitest plus $e2e Playwright E2E)" README.md || { echo "overview line does not say $t ($v Vitest plus $e2e Playwright)"; fail=1; }
          [ "$fail" = 0 ] || { echo "Run scripts/count-tests.sh and update README.md."; exit 1; }
          echo "README agrees with every suite: $t"
