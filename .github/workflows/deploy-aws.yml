name: Deploy to AWS EC2
run-name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Secrets only reach the box when a deploy writes /opt/tellsight/.env, and
  # until this existed the only way to start one was to push a commit. Rotating
  # STRIPE_PRICE_ID on 2026-09-17 meant re-running an unrelated CI run to get a
  # deploy out of it.
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even though CI has not passed for this commit
        type: boolean
        default: false

# One deploy at a time, per instance. Without this, merging a few PRs in quick
# succession starts a deploy per CI run and they race on the same box: on
# 2026-09-14 seven runs for the same sha started inside 106 seconds, five died
# on `mv: cannot move '.deploy-history.new'` because another run had already
# moved it, and production ended up pinned to an older build than main.
#
# cancel-in-progress stays false on purpose. Cancelling a run mid-SSM would
# leave the instance half-written. GitHub keeps only one pending run per group,
# so a burst collapses to "the one running plus the newest" by itself.
concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read # reads CI's conclusion for this sha on a manual run

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-24.04
    # Bound a wedged build or network call without cutting off the guarded
    # rollback path, which can itself need several minutes to pull old images.
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # A manual run skips the workflow_run gate, so it has to ask the question
      # that gate answers. Deploying a commit CI has not passed is sometimes the
      # right call, a flaky e2e should not block a secret rotation, so this is a
      # tick box rather than a wall. Empty is treated as failure: no completed
      # run for this sha is not the same as a green one.
      - name: Check CI passed for this commit
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')
          echo "CI for ${SHA:0:7}: ${conclusion:-none}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for ${SHA:0:7} is '${conclusion:-none}'. Re-run with force checked if that is intended."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ECR_API: ${{ secrets.ECR_API_REPO }}
          ECR_WEB: ${{ secrets.ECR_WEB_REPO }}
        run: |
          SHORT="${HEAD_SHA:0:7}"
          echo "api_image=${ECR_API}:sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "web_image=${ECR_WEB}:sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.api
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ secrets.ECR_API_REPO }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.web
          target: production
          push: true
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # An empty `NAME=` entry is rejected by build-push-action. Return an
          # empty input instead so source-map upload stays optional until the
          # repository secret is configured.
          secrets: ${{ secrets.SENTRY_AUTH_TOKEN != '' && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          tags: |
            ${{ steps.tags.outputs.web_image }}
            ${{ secrets.ECR_WEB_REPO }}:latest

      # Write .env and restart containers via SSM (no SSH key stored anywhere).
      # All secrets are consumed via env: -- they are masked in CI logs and
      # never directly interpolated into a run: command string.
      # DATABASE_URL is the restricted app_user role (RLS enforced);
      # DATABASE_ADMIN_URL is the RDS master/app_admin role (RLS bypassed for
      # migrations). Both must exist first -- see infra/rds-init.sql.
      - name: Deploy via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          CLAUDE_MODEL_TOOLS: ${{ secrets.CLAUDE_MODEL_TOOLS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_TEST_MODE_IN_PRODUCTION: ${{ vars.STRIPE_TEST_MODE_IN_PRODUCTION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_MAILING_ADDRESS: ${{ secrets.EMAIL_MAILING_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_REDIRECT_URI: ${{ secrets.QUICKBOOKS_REDIRECT_URI }}
          QUICKBOOKS_ENVIRONMENT: ${{ secrets.QUICKBOOKS_ENVIRONMENT }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
          SQUARE_CLIENT_ID: ${{ secrets.SQUARE_CLIENT_ID }}
          SQUARE_CLIENT_SECRET: ${{ secrets.SQUARE_CLIENT_SECRET }}
          SQUARE_REDIRECT_URI: ${{ secrets.SQUARE_REDIRECT_URI }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ECR_API_REPO: ${{ secrets.ECR_API_REPO }}
          ECR_WEB_REPO: ${{ secrets.ECR_WEB_REPO }}
        run: python3 scripts/deploy-via-ssm.py

      # continue-on-error so a failure reaches the rollback step below. The
      # final step re-fails the job, so a bad deploy is still red.
      - name: Smoke test
        id: smoke
        continue-on-error: true
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: bash scripts/check-production-health.sh

      # NFR7 was graded NONE by a traceability pass: the redirect and the
      # certificate are Caddy defaults that nothing asserted, so nobody would
      # notice them going away. Runs after the health poll and inside the same
      # rollback guard, because a deploy that serves the app over plain HTTP is a
      # deploy worth reverting.
      - name: Verify HTTPS posture
        id: tls
        continue-on-error: true
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: bash scripts/verify-production-https.sh

      - name: Roll back to previous images
        if: steps.smoke.outcome == 'failure' || steps.tls.outcome == 'failure'
        env:
          ECR_API: ${{ secrets.ECR_API_REPO }}
          ECR_WEB: ${{ secrets.ECR_WEB_REPO }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          # Pop the failed build off deploy-history and pin to whatever is next.
          # Popping is what makes this a stack: a second consecutive rollback
          # steps further back rather than restoring the build it just rejected,
          # which is what the old single .prev.yml did.
          #
          # Exhaustion is a hard failure, not a silent no-op. If nothing older is
          # recorded, production stays on the bad build and this says so.
          ecr_host="${ECR_API%%/*}"
          cmds="$(jq -nc --arg host "$ecr_host" --arg api "$ECR_API" --arg web "$ECR_WEB" '[
            "set -e",
            "cd /opt/tellsight",
            "test -s deploy-history || { echo ROLLBACK_EXHAUSTED_no_history >&2; exit 1; }",
            "tail -n +2 deploy-history > .h && mv .h deploy-history",
            "target=$(head -1 deploy-history)",
            "[ -n \"$target\" ] || { echo ROLLBACK_EXHAUSTED_nothing_older >&2; exit 1; }",
            "echo Rolling back to $target",
            "printf \"services:\\n  api:\\n    image: %s:%s\\n  web:\\n    image: %s:%s\\n\" \($api|@sh) \"$target\" \($web|@sh) \"$target\" > docker-compose.override.yml",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($host)",
            "docker compose pull --quiet || { echo ROLLBACK_IMAGE_GONE_from_ecr_retention_is_10 >&2; exit 1; }",
            "docker compose up -d --remove-orphans"
          ]')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$cmds" \
            --query 'Command.CommandId' --output text)"
          echo "Rollback SSM command: $cmd_id"

          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" || true
          status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
            --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)"
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query 'StandardErrorContent' --output text >&2
            echo "ROLLBACK FAILED: SSM status $status. Production is on the bad build." >&2
            exit 1
          fi

          started=$SECONDS
          for i in $(seq 1 12); do
            if curl --connect-timeout 3 --max-time 5 -fsS "$PROD_URL/api/health/ready" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Rolled back and healthy after $((SECONDS - started))s"
              exit 0
            fi
            [ "$i" -eq 12 ] || sleep 10
          done
          echo "ROLLBACK FAILED: not healthy on the previous build either." >&2
          exit 1

      # Rollback restores service; it does not make the deploy a success.
      - name: Fail the run if the deploy was rolled back
        if: steps.smoke.outcome == 'failure' || steps.tls.outcome == 'failure'
        run: |
          echo "Smoke test or HTTPS check failed. See the rollback step for whether production recovered." >&2
          exit 1
