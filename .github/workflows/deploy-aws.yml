name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ECR_API: ${{ secrets.ECR_API_REPO }}
          ECR_WEB: ${{ secrets.ECR_WEB_REPO }}
        run: |
          SHORT="${HEAD_SHA:0:7}"
          echo "api_image=${ECR_API}:sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "web_image=${ECR_WEB}:sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ secrets.ECR_API_REPO }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.web_image }}
            ${{ secrets.ECR_WEB_REPO }}:latest

      # Write .env and restart containers via SSM (no SSH key stored anywhere).
      # All secrets are consumed via env: -- they are masked in CI logs and
      # never directly interpolated into a run: command string.
      # DATABASE_URL is the restricted app_user role (RLS enforced);
      # DATABASE_ADMIN_URL is the RDS master/app_admin role (RLS bypassed for
      # migrations). Both must exist first -- see infra/rds-init.sql.
      - name: Deploy via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_MAILING_ADDRESS: ${{ secrets.EMAIL_MAILING_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_REDIRECT_URI: ${{ secrets.QUICKBOOKS_REDIRECT_URI }}
          QUICKBOOKS_ENVIRONMENT: ${{ secrets.QUICKBOOKS_ENVIRONMENT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ECR_API_REPO: ${{ secrets.ECR_API_REPO }}
          ECR_WEB_REPO: ${{ secrets.ECR_WEB_REPO }}
        run: |
          python3 - << 'PY'
          import base64, json, os, subprocess, sys, time

          domain = os.environ['PRODUCTION_DOMAIN']

          env_lines = [
              f"NODE_ENV=production",
              f"DATABASE_URL={os.environ['DATABASE_URL']}",
              f"DATABASE_ADMIN_URL={os.environ['DATABASE_ADMIN_URL']}",
              f"CLAUDE_API_KEY={os.environ['CLAUDE_API_KEY']}",
              f"CLAUDE_MODEL={os.environ.get('CLAUDE_MODEL', 'claude-sonnet-4-5-20250929')}",
              f"STRIPE_SECRET_KEY={os.environ['STRIPE_SECRET_KEY']}",
              f"STRIPE_WEBHOOK_SECRET={os.environ['STRIPE_WEBHOOK_SECRET']}",
              f"STRIPE_PRICE_ID={os.environ['STRIPE_PRICE_ID']}",
              f"GOOGLE_CLIENT_ID={os.environ['GOOGLE_CLIENT_ID']}",
              f"GOOGLE_CLIENT_SECRET={os.environ['GOOGLE_CLIENT_SECRET']}",
              f"JWT_SECRET={os.environ['JWT_SECRET']}",
              f"APP_URL=https://{domain}",
              f"PUBLIC_API_URL=https://{domain}",
              f"EMAIL_PROVIDER=resend",
              f"EMAIL_FROM_ADDRESS={os.environ['EMAIL_FROM_ADDRESS']}",
              f"EMAIL_FROM_NAME={os.environ['EMAIL_FROM_NAME']}",
              f"EMAIL_MAILING_ADDRESS={os.environ['EMAIL_MAILING_ADDRESS']}",
              f"RESEND_API_KEY={os.environ['RESEND_API_KEY']}",
              f"RESEND_WEBHOOK_SECRET={os.environ['RESEND_WEBHOOK_SECRET']}",
              f"METRICS_TOKEN={os.environ['METRICS_TOKEN']}",
              f"QUICKBOOKS_ENVIRONMENT={os.environ.get('QUICKBOOKS_ENVIRONMENT') or 'sandbox'}",
          ]

          # QuickBooks is fully optional (isQbConfigured() gates the connector
          # off when any is missing). config.ts's .optional() only skips
          # validation when the key is absent entirely -- an empty string from
          # an unset GitHub secret still fails z.string().url()/.length(64), so
          # these are omitted rather than written as blank lines.
          optional_vars = {
              "QUICKBOOKS_CLIENT_ID": os.environ.get("QUICKBOOKS_CLIENT_ID", ""),
              "QUICKBOOKS_CLIENT_SECRET": os.environ.get("QUICKBOOKS_CLIENT_SECRET", ""),
              "QUICKBOOKS_REDIRECT_URI": os.environ.get("QUICKBOOKS_REDIRECT_URI", ""),
              "ENCRYPTION_KEY": os.environ.get("ENCRYPTION_KEY", ""),
          }
          for key, value in optional_vars.items():
              if value:
                  env_lines.append(f"{key}={value}")

          # Base64-encode so no shell-quoting issues when the string hits the EC2 shell.
          env_b64 = base64.b64encode("\n".join(env_lines).encode()).decode()
          ecr_host = os.environ['ECR_API_REPO'].split('/')[0]

          # The base compose on the instance pins both services to :latest, a
          # moving tag. That is what let a failed pull leave the previous image
          # runnable, so `up -d` restarted stale code and every check passed.
          #
          # An override file is compose's own merge mechanism, so this pins the
          # exact build without restating the base. If the pull fails, the sha
          # tag simply is not present locally and `up -d` fails instead of
          # quietly serving whatever was there before.
          #
          # Written here rather than in terraform user_data because user_data
          # only runs on first boot and carries ignore_changes. Same reason the
          # Caddyfile is written from here.
          short = os.environ['HEAD_SHA'][:7]
          override = (
              "services:\n"
              "  api:\n"
              f"    image: {os.environ['ECR_API_REPO']}:sha-{short}\n"
              "  web:\n"
              f"    image: {os.environ['ECR_WEB_REPO']}:sha-{short}\n"
          )
          override_b64 = base64.b64encode(override.encode()).decode()

          # /api/* must NOT be intercepted here -- Next.js owns that prefix.
          # Its own route.ts files (auth/login, datasets, etc.) hold real BFF
          # logic (cookie handling, session translation), and next.config.ts's
          # rewrite() catches anything without a matching route.ts and proxies
          # it to Express with /api stripped. Sending /api/* to Express
          # directly from Caddy skips all of that -- it broke Google sign-in
          # (browser calls /api/auth/login, a Next.js route; Caddy forwarded
          # it as bare /login, which doesn't exist on Express) and would have
          # broken every other BFF route the same way.
          #
          # Only two paths are legitimately external and never touch a
          # browser session, so they bypass Next.js on purpose: the Stripe/
          # Resend webhooks (server-to-server, need the raw body before
          # Express's JSON parser) and the QuickBooks OAuth callback (Intuit
          # redirects the user's browser straight to it; Next.js has no page
          # there). Both are `handle` (not handle_path) because Express
          # registers these exact paths unprefixed -- stripping would break
          # the match, unlike /api/* where Express genuinely has no /api.
          #
          # Targets are api:3001/web:3000 (Docker Compose service DNS), not
          # 127.0.0.1 -- caddy is a sibling container on the same compose
          # network (ec2.tf), not a process on the host, so 127.0.0.1 inside
          # the caddy container would mean the caddy container itself.
          caddyfile = f"""{domain} {{
              handle /webhooks/* {{
                  reverse_proxy api:3001
              }}
              handle /integrations/quickbooks/callback {{
                  reverse_proxy api:3001
              }}
              reverse_proxy web:3000
          }}
          """
          caddy_b64 = base64.b64encode(caddyfile.encode()).decode()

          commands = [
              # set -e or a failing step just falls through to the next one.
              # A failed `docker compose pull` used to leave `up -d` restarting
              # the stale local image, health check green, deploy reported
              # success, and production silently kept running old code.
              "set -e",
              f"printf '%s' '{env_b64}' | base64 -d > /opt/tellsight/.env",
              f"printf '%s' '{caddy_b64}' | base64 -d > /opt/tellsight/Caddyfile",
              # Keep the outgoing pin so the rollback step can restore it. This is
              # what was actually running, which beats reconstructing it from ECR.
              "cp /opt/tellsight/docker-compose.override.yml /opt/tellsight/docker-compose.override.prev.yml 2>/dev/null || true",
              f"printf '%s' '{override_b64}' | base64 -d > /opt/tellsight/docker-compose.override.yml",
              f"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin {ecr_host}",
              # -a with an age filter, not plain prune: pinning to sha tags means
              # superseded images stay tagged and never become dangling, so
              # `prune -f` reclaims nothing and the disk refills at ~1.4GB per
              # deploy. 48h keeps the last day or so of builds for a rollback
              # while still clearing the backlog. Images in use are never removed.
              "docker image prune -af --filter until=48h",
              # --quiet: pull progress goes to stderr and floods SSM's output
              # buffer, which truncated the actual failure message last time.
              "cd /opt/tellsight && docker compose pull --quiet",
              "docker compose up -d --remove-orphans",
              # Prove the container is actually on the image we just pulled.
              # set -e catches a failed pull, but this catches the whole class:
              # any path where the deploy reports success while production keeps
              # running something else.
              # Compare against the pinned sha tag, not :latest. compose pulls
              # only what it references, so :latest on the box is now whatever
              # the previous deploy left there and would never match.
              f"running=$(docker inspect --format='{{{{.Image}}}}' tellsight-api-1)"
              f" && expected=$(docker image inspect --format='{{{{.Id}}}}' {os.environ['ECR_API_REPO']}:sha-{short})"
              f" && [ \"$running\" = \"$expected\" ]"
              f" || (echo 'DEPLOY DID NOT LAND: container image != pulled image' >&2; exit 1)",
              # caddy's own image/config never change between deploys, so
              # `up -d` won't recreate it just because the bind-mounted
              # Caddyfile's contents changed on disk -- reload explicitly.
              "docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile",
          ]

          send = subprocess.run([
              "aws", "ssm", "send-command",
              "--instance-ids", os.environ['EC2_INSTANCE_ID'],
              "--document-name", "AWS-RunShellScript",
              "--parameters", json.dumps({"commands": commands}),
              "--output", "json",
          ], capture_output=True, text=True)

          if send.returncode != 0:
              print(send.stderr, file=sys.stderr)
              sys.exit(1)

          cmd_id = json.loads(send.stdout)["Command"]["CommandId"]
          instance_id = os.environ['EC2_INSTANCE_ID']
          print(f"SSM command ID: {cmd_id}")

          for _ in range(36):
              time.sleep(5)
              poll = subprocess.run([
                  "aws", "ssm", "get-command-invocation",
                  "--command-id", cmd_id,
                  "--instance-id", instance_id,
                  "--output", "json",
              ], capture_output=True, text=True)
              if poll.returncode != 0:
                  continue
              inv = json.loads(poll.stdout)
              status = inv.get("Status", "")
              print(f"Status: {status}")
              if status == "Success":
                  print(inv.get("StandardOutputContent", ""))
                  sys.exit(0)
              if status in ("Failed", "TimedOut", "Cancelled"):
                  print(inv.get("StandardErrorContent", ""), file=sys.stderr)
                  sys.exit(1)

          print("Timed out waiting for SSM command to complete", file=sys.stderr)
          sys.exit(1)
          PY

      # continue-on-error so a failure reaches the rollback step below. The
      # final step re-fails the job, so a bad deploy is still red.
      - name: Smoke test
        id: smoke
        continue-on-error: true
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          # ROLLBACK DRILL 2026-08-30, reverted immediately after. Polls a path
          # that cannot return ok so the smoke test fails and the rollback runs.
          # Deliberately only this poll: the rollback's own health check further
          # down still uses the real endpoint, so it can confirm recovery.
          # The application itself is untouched and stays healthy throughout.
          echo "Polling $PROD_URL/api/health/rollback-drill-not-a-real-route..."
          for i in $(seq 1 18); do
            body=$(curl -fsS "$PROD_URL/api/health/rollback-drill-not-a-real-route" 2>/dev/null || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Healthy after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become healthy within 3 minutes"
          exit 1

      - name: Roll back to previous images
        if: steps.smoke.outcome == 'failure'
        env:
          ECR_API: ${{ secrets.ECR_API_REPO }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          # Restore the override the deploy just replaced. That file is what was
          # actually running, so it beats reconstructing the previous build from
          # ECR digests. Re-tagging :latest, which is what this used to do, no
          # longer rolls anything back: compose reads the pinned sha tags now and
          # ignores :latest entirely.
          ecr_host="${ECR_API%%/*}"
          cmds="$(jq -nc --arg host "$ecr_host" '[
            "set -e",
            "cd /opt/tellsight",
            "test -f docker-compose.override.prev.yml",
            "cp docker-compose.override.prev.yml docker-compose.override.yml",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($host)",
            "docker compose pull --quiet",
            "docker compose up -d --remove-orphans"
          ]')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$cmds" \
            --query 'Command.CommandId' --output text)"
          echo "Rollback SSM command: $cmd_id"

          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" || true
          status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
            --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)"
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query 'StandardErrorContent' --output text >&2
            echo "ROLLBACK FAILED: SSM status $status. Production is on the bad build." >&2
            exit 1
          fi

          for i in $(seq 1 18); do
            if curl -fsS "$PROD_URL/api/health/ready" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Rolled back and healthy after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "ROLLBACK FAILED: not healthy on the previous build either." >&2
          exit 1

      # Rollback restores service; it does not make the deploy a success.
      - name: Fail the run if the deploy was rolled back
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed. See the rollback step for whether production recovered." >&2
          exit 1
